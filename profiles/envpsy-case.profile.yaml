# 环境心理学 案例批 profile（2026-10-13 用户批准案例 A 方案）
# 案例片 = 设计论文文体 × 图纸视觉母语 × 纪录片叙事（无真人镜头）。
# 10 分钟档：600s 需 ≥3060 字；本 profile 把字数下限写成硬约束（批5教训）。

mode: PROJECT_ROUTE

visual:
  style: clean_vector
  style_pack: cinematic_layout_system  # v2：版式即叙事——六幕六种版式骨架（滑动对比/决策桌/四分屏/地图透镜层/大数字生长/图形接力轴测），禁止两幕共用骨架
  style_note: 镜头系统必须实现——视口关键帧插值（pan/zoom 缓动），每幕至少一次镜头运动，虚拟画布 2-4 倍视口；图表与元素一律生长动画（禁止入场后静止）；文字嵌入画面负空间，底字幕条仅数据段保留；幕间用变形转场（图形接力：前一幕形状演化为后一幕元素）。叙事=决策驱动六段（对比冷开场→代入决策→多方视角→机制拆解→数据揭示→复盘迁移），理论第4段才出场，结尾开放决策题。全程代码渲染禁真人素材。

backend:
  preferred: null
  allowed:
    - web_2d
    - manim

narration:
  sentences: 44-52 句
  duration: 约 570-660 秒（目标 600）
  note: 硬性要求：旁白总字数（含标点）必须 ≥3000 字，平均每句 22-26 字——低于字数下限视为不合格。TTS 实测语速 5.1 字/秒，字数不足必然导致时长不达标。文体=决策驱动叙事（冷开场→代入决策→多方视角→机制拆解→数据揭示→复盘迁移）：设问、悬念、多方内心台词可用且鼓励；所有数字必须带来源角标（NYC DOT 2010 报告/Snøhetta 官方稿/brief 标注来源），不得虚构数据；结尾是抛给观众的开放决策题，不是标准答案总结。

storyboard:
  pacing: documentary  # 纪录片叙事节奏：每幕一个叙事任务，幕内先画面后揭底
  intro_max_seconds: 60

knowledge:
  use_project_cases: true
  use_global_success_cases: false
  use_failure_memory: true
