<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">图5-1 同一个客厅的两种组群（教学示意图·尺寸为教学假设）</text>

  <!-- ===== Panel A: 围合式 ===== -->
  <g transform="translate(60,70)">
    <text x="200" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">围合式：交谈优先</text>
    <!-- room 4.2m x 3.4m at 100px/m -->
    <rect x="0" y="40" width="420" height="340" fill="#fafafa" stroke="#1a1a1a" stroke-width="3"/>
    <!-- sofa along top (north) -->
    <rect x="70" y="50" width="220" height="55" rx="8" fill="#dce8f5" stroke="#3a6ea5" stroke-width="2"/>
    <text x="180" y="84" text-anchor="middle" font-size="13" fill="#1a3c5e">三人沙发</text>
    <!-- armchairs left/right facing inward -->
    <rect x="25" y="150" width="70" height="70" rx="8" fill="#dce8f5" stroke="#3a6ea5" stroke-width="2"/>
    <text x="60" y="192" text-anchor="middle" font-size="12" fill="#1a3c5e">单椅</text>
    <rect x="265" y="150" width="70" height="70" rx="8" fill="#dce8f5" stroke="#3a6ea5" stroke-width="2"/>
    <text x="300" y="192" text-anchor="middle" font-size="12" fill="#1a3c5e">单椅</text>
    <!-- coffee table -->
    <rect x="140" y="160" width="80" height="50" rx="6" fill="#f2ede2" stroke="#8a7a55" stroke-width="2"/>
    <text x="180" y="191" text-anchor="middle" font-size="12" fill="#5c4f33">茶几</text>
    <!-- TV wall bottom (south) with balcony door at SE -->
    <rect x="120" y="372" width="180" height="8" fill="#1a1a1a"/>
    <text x="210" y="356" text-anchor="middle" font-size="12" fill="#333">电视墙</text>
    <!-- balcony door opening bottom-right -->
    <rect x="340" y="360" width="70" height="20" fill="none" stroke="#2e8b57" stroke-width="3"/>
    <text x="375" y="402" text-anchor="middle" font-size="12" fill="#2e8b57">去阳台</text>
    <!-- path from corridor (left) to balcony -->
    <path d="M -18 260 L 105 260 Q 150 260 150 300 L 150 330 Q 150 370 320 370 L 372 370" fill="none" stroke="#e07b00" stroke-width="4" stroke-dasharray="10,6" marker-end="url(#arrA)"/>
    <defs>
      <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#e07b00"/>
      </marker>
    </defs>
    <!-- narrowest gap marker between right armchair and coffee table area on path -->
    <line x1="222" y1="322" x2="222" y2="370" stroke="#d0021b" stroke-width="2"/>
    <line x1="216" y1="322" x2="228" y2="322" stroke="#d0021b" stroke-width="2"/>
    <line x1="216" y1="370" x2="228" y2="370" stroke="#d0021b" stroke-width="2"/>
    <text x="238" y="342" font-size="12" fill="#d0021b">最窄处 约0.5m</text>
    <text x="200" y="438" text-anchor="middle" font-size="12.5" fill="#555">座位彼此看得见脸，聊天自然；</text>
    <text x="200" y="458" text-anchor="middle" font-size="12.5" fill="#555">中央与通道被家具占据，去阳台变窄</text>
  </g>

  <!-- ===== Panel B: 沿墙式 ===== -->
  <g transform="translate(500,70)">
    <text x="200" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">沿墙式：游戏地面优先</text>
    <rect x="0" y="40" width="420" height="340" fill="#fafafa" stroke="#1a1a1a" stroke-width="3"/>
    <!-- sofa top-left along wall -->
    <rect x="20" y="50" width="200" height="55" rx="8" fill="#dce8f5" stroke="#3a6ea5" stroke-width="2"/>
    <text x="120" y="84" text-anchor="middle" font-size="13" fill="#1a3c5e">三人沙发（靠墙）</text>
    <!-- armchair top-right along wall -->
    <rect x="245" y="50" width="75" height="70" rx="8" fill="#dce8f5" stroke="#3a6ea5" stroke-width="2"/>
    <text x="282" y="92" text-anchor="middle" font-size="12" fill="#1a3c5e">单椅</text>
    <!-- TV on east wall -->
    <rect x="408" y="150" width="8" height="150" fill="#1a1a1a"/>
    <text x="395" y="230" text-anchor="end" font-size="12" fill="#333">电视</text>
    <!-- play mat center -->
    <rect x="90" y="170" width="220" height="130" rx="10" fill="#eaf4ea" stroke="#2e8b57" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="200" y="230" text-anchor="middle" font-size="13" fill="#2e8b57">孩子游戏区（整块空地）</text>
    <!-- balcony door bottom-right -->
    <rect x="340" y="360" width="70" height="20" fill="none" stroke="#2e8b57" stroke-width="3"/>
    <text x="375" y="402" text-anchor="middle" font-size="12" fill="#2e8b57">去阳台</text>
    <!-- wide clear path -->
    <path d="M -18 300 L 372 300 Q 372 340 372 372" fill="none" stroke="#e07b00" stroke-width="5" stroke-dasharray="10,6" marker-end="url(#arrB)"/>
    <defs>
      <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#e07b00"/>
      </marker>
    </defs>
    <text x="200" y="160" text-anchor="middle" font-size="12" fill="#e07b00">通道约2m，畅通</text>
    <text x="200" y="438" text-anchor="middle" font-size="12.5" fill="#555">中央空地大、动线宽松；</text>
    <text x="200" y="458" text-anchor="middle" font-size="12.5" fill="#555">座位隔得远，说话要提高嗓门</text>
  </g>

  <!-- footnote -->
  <text x="460" y="540" text-anchor="middle" font-size="12.5" fill="#888">橙色虚线＝去阳台动线；红色＝通道最窄处。房间按 4.2m×3.4m 局部绘制，家具比例示意。</text>
</svg>
