<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">图12-1 五轮整合与回退：综合设计的工作循环（教学示意）</text>
  <!-- five rounds as stations around a loop -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <!-- R1 top -->
    <rect x="350" y="60" width="220" height="58" rx="12" fill="#e8f4ea" stroke="#2e8b57" stroke-width="2"/>
    <text x="460" y="84" fill="#1e6e3e">第一轮·需求校准</text>
    <text x="460" y="104" font-size="10.5" font-weight="normal" fill="#2e8b57">行为都有落点吗？</text>
    <!-- R2 right -->
    <rect x="640" y="170" width="220" height="58" rx="12" fill="#eaf2fa" stroke="#3a6ea5" stroke-width="2"/>
    <text x="750" y="194" fill="#1a3c5e">第二轮·户型组织</text>
    <text x="750" y="214" font-size="10.5" font-weight="normal" fill="#3a6ea5">固定项内做两版分区动线</text>
    <!-- R3 bottom right -->
    <rect x="640" y="330" width="220" height="58" rx="12" fill="#fdf0dd" stroke="#d8a86a" stroke-width="2"/>
    <text x="750" y="354" fill="#b07a2a">第三轮·局部协调</text>
    <text x="750" y="374" font-size="10.5" font-weight="normal" fill="#d8a86a">单项放回同一平面查冲突</text>
    <!-- R4 bottom left -->
    <rect x="60" y="330" width="220" height="58" rx="12" fill="#fdeeee" stroke="#d98a9a" stroke-width="2"/>
    <text x="170" y="354" fill="#a04a5e">第四轮·环境家具</text>
    <text x="170" y="374" font-size="10.5" font-weight="normal" fill="#d98a9a">灯位/材料/收纳统一版本</text>
    <!-- R5 left -->
    <rect x="60" y="170" width="220" height="58" rx="12" fill="#efecf7" stroke="#9a8ac2" stroke-width="2"/>
    <text x="170" y="194" fill="#5f4a9e">第五轮·表达复核</text>
    <text x="170" y="214" font-size="10.5" font-weight="normal" fill="#9a8ac2">分层图纸＋待核交付</text>
  </g>
  <!-- forward arrows -->
  <g fill="none" stroke="#555" stroke-width="2.2">
    <path d="M 580 96 Q 690 110 728 162" marker-end="url(#arr)"/>
    <path d="M 752 240 L 752 322" marker-end="url(#arr)"/>
    <path d="M 630 362 Q 420 380 290 362" marker-end="url(#arr)"/>
    <path d="M 172 322 L 172 240" marker-end="url(#arr)"/>
    <path d="M 292 196 Q 340 130 342 100" marker-end="url(#arr)"/>
  </g>
  <!-- rollback arrows (red dashed) -->
  <g fill="none" stroke="#d0021b" stroke-width="2" stroke-dasharray="7,5">
    <path d="M 640 300 Q 500 250 470 122" marker-end="url(#arrR)"/>
    <path d="M 460 430 Q 460 450 820 450 L 820 396" marker-end="url(#arrR)" transform="translate(-40,0)"/>
    <path d="M 150 330 Q 120 280 140 236" marker-end="url(#arrR)"/>
  </g>
  <g font-size="11" fill="#d0021b" text-anchor="middle">
    <text x="520" y="228">局部冲突→重排分区</text>
    <text x="470" y="470">前提不成立→回退二/三轮重做（"效果图已出"不是理由）</text>
    <text x="98" y="288">复核否决→改深化</text>
  </g>
  <!-- center note -->
  <text x="460" y="270" text-anchor="middle" font-size="13" fill="#333">回退不是失败，</text>
  <text x="460" y="290" text-anchor="middle" font-size="13" fill="#333">是方法在工作</text>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d0021b"/></marker>
  </defs>
</svg>
