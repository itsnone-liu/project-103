<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">图1-3 学习循环×五阶段：一个动作转满全书（教学示意）</text>
  <!-- outer five-stage arc -->
