    <rect x="70" y="80" width="140" height="46" rx="23" fill="#e8f1fa" stroke="#3a6ea5" stroke-width="1.8"/><text x="140" y="109" fill="#1a3c5e">① 需求研究</text>
    <rect x="235" y="80" width="140" height="46" rx="23" fill="#eaf4ea" stroke="#2e8b57" stroke-width="1.8"/><text x="305" y="109" fill="#2e8b57">② 户型组织</text>
    <rect x="400" y="80" width="140" height="46" rx="23" fill="#fdf0dd" stroke="#d8a86a" stroke-width="1.8"/><text x="470" y="109" fill="#b07a2a">③ 局部空间</text>
