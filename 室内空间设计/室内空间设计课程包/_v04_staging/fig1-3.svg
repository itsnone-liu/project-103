    <line x1="377" y1="103" x2="398" y2="103"/><path d="M 398 98 L 406 103 L 398 108 z"/>
    <line x1="542" y1="103" x2="563" y2="103"/><path d="M 563 98 L 571 103 L 563 108 z"/>
    <line x1="717" y1="103" x2="738" y2="103"/><path d="M 738 98 L 746 103 L 738 108 z"/>
