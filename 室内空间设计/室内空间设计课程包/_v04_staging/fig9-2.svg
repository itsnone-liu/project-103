<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="920" height="380" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">图9-2 色彩来自关系：同一面墙的四种命运（教学示意）</text>
  <!-- four swatch rooms: same wall color #d9cbb8, different light/neighbor -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#f5efe3"/>
    <rect x="0" y="0" width="180" height="90" fill="#e8ddc9"/>
    <circle cx="90" cy="45" r="14" fill="#fff8dd" stroke="#e0c060" stroke-width="2"/>
    <rect x="30" y="110" width="120" height="46" rx="6" fill="#7a6a52"/>
    <text x="90" y="138" text-anchor="middle" font-size="11" fill="#f0e8d8">深色沙发</text>
    <text x="90" y="205" text-anchor="middle" font-size="12.5" fill="#333">暖光＋深邻色→暖而稳</text>
    <text x="90" y="228" text-anchor="middle" font-size="11" fill="#888">北向书房可用此法加温</text>
  </g>
  <g transform="translate(290,70)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#f2f4f6"/>
    <rect x="0" y="0" width="180" height="90" fill="#e3e6ea"/>
    <circle cx="90" cy="45" r="14" fill="#ffffff" stroke="#9ab0cc" stroke-width="2"/>
    <rect x="30" y="110" width="120" height="46" rx="6" fill="#c8d2dc"/>
    <text x="90" y="138" text-anchor="middle" font-size="11" fill="#5a6a78">浅色沙发</text>
    <text x="90" y="205" text-anchor="middle" font-size="12.5" fill="#333">冷白光＋浅邻色→清而亮</text>
    <text x="90" y="228" text-anchor="middle" font-size="11" fill="#888">白天办公态</text>
  </g>
  <g transform="translate(510,70)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#efe9df"/>
    <rect x="0" y="0" width="180" height="90" fill="#dcd2c0"/>
    <rect x="42" y="106" width="96" height="50" rx="6" fill="#8a4a3a"/>
    <text x="90" y="136" text-anchor="middle" font-size="11" fill="#f0dccf">红木家具</text>
    <text x="90" y="205" text-anchor="middle" font-size="12.5" fill="#333">同光换深红邻色→对比强</text>
    <text x="90" y="228" text-anchor="middle" font-size="11" fill="#888">强调色改变整面墙的气质</text>
  </g>
  <g transform="translate(730,70)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="#e9e4d8"/>
    <rect x="0" y="0" width="180" height="90" fill="#cfc7b4"/>
    <text x="60" y="50" font-size="26" fill="#8a8270">☀</text>
    <rect x="30" y="110" width="120" height="46" rx="6" fill="#b8ad95"/>
    <text x="90" y="138" text-anchor="middle" font-size="11" fill="#5a5040">日光直射</text>
    <text x="90" y="205" text-anchor="middle" font-size="12.5" fill="#333">南向午后→颜色更暖更浅</text>
    <text x="90" y="228" text-anchor="middle" font-size="11" fill="#888">同一墙色，不同时辰不同色</text>
  </g>
  <!-- control variable note -->
  <rect x="70" y="320" width="840" height="44" rx="10" fill="#f7f7f7" stroke="#ddd" stroke-width="1.5"/>
  <text x="490" y="338" text-anchor="middle" font-size="12.5" fill="#333">控制变量法：固定灯光换墙色（看墙色的作用）；固定墙色换灯光（看光源的作用）；</text>
  <text x="490" y="356" text-anchor="middle" font-size="12.5" fill="#333">各条件下的"米色"其实是四种颜色——色号不变，关系变了。</text>
</svg>
