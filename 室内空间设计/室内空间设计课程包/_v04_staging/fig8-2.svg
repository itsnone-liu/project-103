<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="920" height="460" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">图8-2 三层照明与四组回路：客餐厅示例（教学示意）</text>
  <!-- plan -->
  <rect x="60" y="70" width="420" height="330" fill="#fafafa" stroke="#1a1a1a" stroke-width="3"/>
  <g stroke="#ccc" stroke-width="1.2"><line x1="60" y1="230" x2="480" y2="230"/></g>
  <text x="120" y="100" font-size="12.5" fill="#555">餐区（北）</text>
  <text x="150" y="320" font-size="12.5" fill="#555">起居区（南）</text>
  <!-- furniture -->
  <rect x="140" y="130" width="90" height="52" fill="#f2ede2" stroke="#8a7a55" stroke-width="1.8"/>
  <text x="185" y="160" text-anchor="middle" font-size="11" fill="#5c4f33">餐桌</text>
  <rect x="120" y="270" width="130" height="62" rx="8" fill="#dce8f5" stroke="#3a6ea5" stroke-width="1.8"/>
  <text x="185" y="306" text-anchor="middle" font-size="11" fill="#1a3c5e">沙发</text>
  <rect x="300" y="280" width="70" height="10" rx="3" fill="#2b2b2b"/>
  <text x="335" y="270" text-anchor="middle" font-size="11" fill="#333">电视</text>
  <!-- ambient: cove strip -->
  <rect x="70" y="80" width="400" height="8" rx="4" fill="#cfe3f5"/>
  <rect x="70" y="382" width="400" height="8" rx="4" fill="#cfe3f5"/>
  <rect x="70" y="88" width="8" height="294" fill="#cfe3f5"/>
  <text x="480" y="70" font-size="11.5" fill="#3a6ea5">环境光：周边灯带</text>
  <!-- task: pendant + reading lamp -->
  <circle cx="185" cy="156" r="16" fill="#ffd9a0" stroke="#b8860b" stroke-width="2"/>
  <text x="185" y="118" text-anchor="middle" font-size="11" fill="#8a5a00">餐桌吊灯（任务）</text>
  <circle cx="278" cy="292" r="10" fill="#ffd9a0" stroke="#b8860b" stroke-width="1.8"/>
  <text x="300" y="330" font-size="11" fill="#8a5a00">阅读落地灯（任务）</text>
  <!-- accent: cabinet -->
  <rect x="380" y="90" width="60" height="70" rx="4" fill="#efecf7" stroke="#9a8ac2" stroke-width="1.6"/>
  <text x="410" y="130" text-anchor="middle" font-size="10.5" fill="#5f4a9e">展示柜</text>
  <circle cx="410" cy="150" r="7" fill="#e8d5ff" stroke="#9a8ac2" stroke-width="1.5"/>
  <text x="440" y="182" font-size="11" fill="#5f4a9e">重点光</text>
  <!-- night path -->
  <path d="M 70 420 L 250 420 L 250 360" fill="none" stroke="#7cb98a" stroke-width="3" stroke-dasharray="6,5"/>
  <circle cx="70" cy="420" r="6" fill="#7cb98a"/><circle cx="250" cy="420" r="6" fill="#7cb98a"/>
  <text x="160" y="440" font-size="11" fill="#2e8b57">夜行回路：低位感应（接图6-3）</text>
  <!-- switch panel -->
  <rect x="540" y="90" width="340" height="250" rx="14" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
  <text x="710" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">四组回路面板</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="570" y="140" width="130" height="40" rx="8" fill="#dff0df" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="635" y="165" fill="#2e8b57">① 早餐：自然光＋纱帘</text>
    <rect x="720" y="140" width="130" height="40" rx="8" fill="#fdf0dd" stroke="#d8a86a" stroke-width="1.6"/>
    <text x="785" y="158" fill="#b07a2a">② 晚餐：</text><text x="785" y="174" fill="#b07a2a">吊灯＋低环境</text>
    <rect x="570" y="195" width="130" height="40" rx="8" fill="#efecf7" stroke="#9a8ac2" stroke-width="1.6"/>
    <text x="635" y="213" fill="#5f4a9e">③ 观影：</text><text x="635" y="229" fill="#5f4a9e">仅重点光</text>
    <rect x="720" y="195" width="130" height="40" rx="8" fill="#e8f4ea" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="785" y="213" fill="#1e6e3e">④ 夜行：</text><text x="785" y="229" fill="#1e6e3e">低位感应·不扰卧</text>
  </g>
  <text x="710" y="270" text-anchor="middle" font-size="11.5" fill="#888">统一顶灯：四个场景都做不到</text>
  <text x="710" y="290" text-anchor="middle" font-size="11.5" fill="#888">分区回路：每个场景都成立</text>
  <text x="710" y="316" text-anchor="middle" font-size="12" fill="#b07a2a">钱花在回路上，比花在灯上值</text>
  <text x="460" y="448" text-anchor="middle" font-size="12" fill="#888">先列情境（谁、在哪、做什么、不打扰谁），后定灯具；家具挪位，灯位跟着改。</text>
</svg>
