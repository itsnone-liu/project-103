<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">图4-2 U90简化平面与四条动线（教学示意·非比例底图）</text>
  <!-- simplified U90 outline 420x460, origin 240,60 -->
  <rect x="240" y="60" width="420" height="460" fill="#fafafa" stroke="#1a1a1a" stroke-width="3"/>
  <!-- zones: kitchen NW, entry N-mid, corridor down, LR south big, bedrooms SE/SW etc simplified -->
  <g stroke="#bbb" stroke-width="1.4" fill="none">
    <line x1="240" y1="200" x2="400" y2="200"/><!-- kitchen south edge -->
    <line x1="400" y1="60" x2="400" y2="200"/><!-- kitchen east edge -->
    <line x1="400" y1="140" x2="480" y2="140"/><!-- entry bottom -->
    <line x1="480" y1="60" x2="480" y2="520"/><!-- main corridor west edge -->
    <line x1="480" y1="300" x2="240" y2="300"/><!-- bathroom/study zone -->
    <line x1="360" y1="300" x2="360" y2="380"/>
    <line x1="240" y1="380" x2="360" y2="380"/>
    <line x1="360" y1="140" x2="360" y2="200"/>
  </g>
  <g font-size="12.5" fill="#555" text-anchor="middle">
    <text x="320" y="130">厨房</text>
    <text x="440" y="105">玄关</text>
    <text x="330" y="345">公卫</text>
    <text x="430" y="345" font-size="12">书房/老人房</text>
    <text x="160" y="245" text-anchor="start" font-size="12">生活阳台</text>
    <text x="450" y="440" font-size="14" font-weight="bold">客餐厅</text>
    <text x="600" y="130">儿童房</text>
    <text x="200" y="470" text-anchor="start">主卧</text>
    <text x="620" y="245">观景阳台</text>
  </g>
  <!-- furniture hints -->
  <g>
    <rect x="500" y="400" width="120" height="70" rx="6" fill="#dce8f5" stroke="#3a6ea5" stroke-width="1.6"/>
    <text x="560" y="440" text-anchor="middle" font-size="11" fill="#1a3c5e">沙发</text>
    <rect x="505" y="330" width="80" height="46" fill="#f2ede2" stroke="#8a7a55" stroke-width="1.6"/>
    <text x="545" y="358" text-anchor="middle" font-size="11" fill="#5c4f33">餐桌</text>
    <rect x="310" y="80" width="60" height="46" fill="#f2ede2" stroke="#8a7a55" stroke-width="1.6"/>
    <text x="340" y="108" text-anchor="middle" font-size="11" fill="#5c4f33">灶台</text>
  </g>
  <!-- paths -->
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e07b00"/></marker>
    <marker id="p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/></marker>
    <marker id="p3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e8b57"/></marker>
    <marker id="p4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0021b"/></marker>
  </defs>
  <!-- housework: kitchen -> dining -->
  <path d="M 340 150 Q 420 210 500 345" fill="none" stroke="#e07b00" stroke-width="3" stroke-dasharray="9,5" marker-end="url(#p1)"/>
  <!-- daily: entry -> living -->
  <path d="M 440 130 Q 460 250 530 400" fill="none" stroke="#3a6ea5" stroke-width="3" stroke-dasharray="9,5" marker-end="url(#p2)"/>
  <!-- visitor: entry -> guest bath via corridor -->
  <path d="M 445 125 Q 492 200 440 290" fill="none" stroke="#2e8b57" stroke-width="3" stroke-dasharray="9,5" marker-end="url(#p3)"/>
  <!-- night: elder room -> public bath -->
  <path d="M 430 315 L 340 315" fill="none" stroke="#d0021b" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#p4)"/>
  <!-- crossing marker -->
  <circle cx="468" cy="222" r="10" fill="none" stroke="#d0021b" stroke-width="2.2"/>
  <text x="490" y="212" font-size="11.5" fill="#d0021b">交叉点</text>
  <!-- legend -->
  <g stroke-width="3" fill="none">
    <line x1="700" y1="180" x2="740" y2="180" stroke="#e07b00" stroke-dasharray="9,5"/>
    <line x1="700" y1="210" x2="740" y2="210" stroke="#3a6ea5" stroke-dasharray="9,5"/>
    <line x1="700" y1="240" x2="740" y2="240" stroke="#2e8b57" stroke-dasharray="9,5"/>
    <line x1="700" y1="270" x2="740" y2="270" stroke="#d0021b" stroke-dasharray="4,4"/>
  </g>
  <g font-size="12.5" fill="#555">
    <text x="750" y="185">家务：采购→厨→餐</text>
    <text x="750" y="215">日常：入户→客厅</text>
    <text x="750" y="245">访客：入户→公卫</text>
    <text x="750" y="275">夜起：老人房→公卫</text>
  </g>
  <text x="450" y="546" text-anchor="middle" font-size="12" fill="#888">简化示意图，正式使用须按户型库出比例底图；红线最短，却最重要。</text>
</svg>
