<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">图1-1 一张餐桌的一天：五层生活轮流上场（教学示意）</text>
  <!-- time axis -->
  <line x1="80" y1="330" x2="840" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <g font-size="12.5" fill="#555" text-anchor="middle">
    <text x="130" y="356">6:30</text><text x="290" y="356">9:00</text><text x="450" y="356">16:00</text>
    <text x="610" y="356">19:30</text><text x="770" y="356">21:00</text><text x="840" y="356">23:00</text>
  </g>
  <g stroke="#999" stroke-width="1.2">
    <line x1="130" y1="324" x2="130" y2="336"/><line x1="290" y1="324" x2="290" y2="336"/>
    <line x1="450" y1="324" x2="450" y2="336"/><line x1="610" y1="324" x2="610" y2="336"/>
    <line x1="770" y1="324" x2="770" y2="336"/><line x1="840" y1="324" x2="840" y2="336"/>
  </g>
  <!-- table plan symbol repeated along axis -->
  <g stroke="#5c4f33" stroke-width="1.8">
    <rect x="108" y="296" width="44" height="26" fill="#f2ede2"/><rect x="112" y="300" width="36" height="18" fill="none" stroke="#8a7a55" stroke-width="1"/>
    <rect x="268" y="296" width="44" height="26" fill="#f2ede2"/><rect x="272" y="300" width="36" height="18" fill="none" stroke="#8a7a55" stroke-width="1"/>
    <rect x="428" y="296" width="44" height="26" fill="#f2ede2"/><rect x="432" y="300" width="36" height="18" fill="none" stroke="#8a7a55" stroke-width="1"/>
    <rect x="588" y="296" width="44" height="26" fill="#f2ede2"/><rect x="592" y="300" width="36" height="18" fill="none" stroke="#8a7a55" stroke-width="1"/>
    <rect x="748" y="296" width="44" height="26" fill="#f2ede2"/><rect x="752" y="300" width="36" height="18" fill="none" stroke="#8a7a55" stroke-width="1"/>
  </g>
  <!-- five layer color blocks with labels -->
  <g text-anchor="middle">
    <rect x="88" y="80" width="100" height="180" rx="8" fill="#e8f1fa" stroke="#7aa7cc" stroke-width="1.5"/>
    <text x="138" y="106" font-size="13" fill="#3a6ea5">生理起居</text>
    <text x="138" y="130" font-size="12" fill="#555">全家早餐</text>
    <rect x="248" y="80" width="100" height="180" rx="8" fill="#fdf0dd" stroke="#d8a86a" stroke-width="1.5"/>
    <text x="298" y="106" font-size="13" fill="#b07a2a">家务</text>
    <text x="298" y="130" font-size="12" fill="#555">收拾归位</text>
    <text x="298" y="148" font-size="12" fill="#555">桌面清空</text>
    <rect x="408" y="80" width="100" height="180" rx="8" fill="#eaf4ea" stroke="#7cb98a" stroke-width="1.5"/>
    <text x="458" y="106" font-size="13" fill="#2e8b57">个人发展</text>
    <text x="458" y="130" font-size="12" fill="#555">女儿手工</text>
    <text x="458" y="148" font-size="12" fill="#555">拼图作业</text>
    <rect x="568" y="80" width="100" height="180" rx="8" fill="#fce8ec" stroke="#d98aa0" stroke-width="1.5"/>
    <text x="618" y="106" font-size="13" fill="#b04a68">家庭交往</text>
    <text x="618" y="130" font-size="12" fill="#555">全家晚餐</text>
    <text x="618" y="148" font-size="12" fill="#555">饭后聊天</text>
    <rect x="728" y="80" width="100" height="180" rx="8" fill="#efecf7" stroke="#9a8ac2" stroke-width="1.5"/>
    <text x="778" y="106" font-size="13" fill="#5f4a9e">个人发展</text>
    <text x="778" y="130" font-size="12" fill="#555">沈太太</text>
    <text x="778" y="148" font-size="12" fill="#555">备课批改</text>
  </g>
  <!-- connectors -->
  <g stroke="#aaa" stroke-width="1.3" stroke-dasharray="4,4">
    <line x1="130" y1="264" x2="130" y2="292"/><line x1="290" y1="264" x2="290" y2="292"/>
    <line x1="450" y1="264" x2="450" y2="292"/><line x1="610" y1="264" x2="610" y2="292"/>
    <line x1="770" y1="264" x2="770" y2="292"/>
  </g>
  <text x="450" y="400" text-anchor="middle" font-size="12.5" fill="#888">同一张餐桌在一天内切换身份；第五层"领域与归属"藏在每一幕里——这是"我们家的桌子"。</text>
</svg>
