<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">图8-1 书桌与窗的三种关系（教学示意）</text>
  <!-- three panels: window + desk + person -->
  <g transform="translate(60,70)">
    <text x="130" y="20" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e8b57">侧向采光 ✓</text>
    <rect x="0" y="60" width="260" height="170" fill="#f7f9f4" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="10" y="70" width="90" height="10" fill="#ffd9a0" stroke="#b8860b" stroke-width="1.6"/>
    <text x="55" y="98" text-anchor="middle" font-size="11.5" fill="#8a5a00">窗</text>
    <!-- arrows: light from left -->
    <g stroke="#f0a832" stroke-width="2">
      <line x1="30" y1="120" x2="80" y2="130"/><line x1="30" y1="155" x2="80" y2="160"/><line x1="30" y1="190" x2="80" y2="195"/>
    </g>
    <!-- desk right, person beside -->
    <rect x="120" y="170" width="110" height="34" rx="3" fill="#f2ede2" stroke="#8a7a55" stroke-width="1.8"/>
    <text x="175" y="192" text-anchor="middle" font-size="11" fill="#5c4f33">书桌</text>
    <circle cx="185" cy="130" r="8" fill="#fce8ec" stroke="#d98aa0" stroke-width="1.5"/>
    <text x="175" y="156" text-anchor="middle" font-size="10.5" fill="#888">人面朝窗侧</text>
    <text x="130" y="262" text-anchor="middle" font-size="12" fill="#2e8b57">光从侧面来，纸面无影无眩光</text>
  </g>
  <g transform="translate(340,70)">
    <text x="130" y="20" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b04a4a">正对窗 ✗</text>
    <rect x="0" y="60" width="260" height="170" fill="#f7f9f4" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="80" y="70" width="100" height="10" fill="#ffd9a0" stroke="#b8860b" stroke-width="1.6"/>
    <text x="130" y="98" text-anchor="middle" font-size="11.5" fill="#8a5a00">窗（逆光）</text>
    <g stroke="#f0a832" stroke-width="2">
      <line x1="110" y1="115" x2="110" y2="150"/><line x1="130" y1="115" x2="130" y2="150"/><line x1="150" y1="115" x2="150" y2="150"/>
    </g>
    <rect x="75" y="185" width="110" height="34" rx="3" fill="#f2ede2" stroke="#8a7a55" stroke-width="1.8"/>
    <circle cx="130" cy="152" r="8" fill="#fce8ec" stroke="#d98aa0" stroke-width="1.5"/>
    <text x="130" y="262" text-anchor="middle" font-size="12" fill="#b04a4a">窗外亮、纸面暗，眼睛反复调节</text>
  </g>
  <g transform="translate(620,70)">
    <text x="130" y="20" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b07a2a">背对窗 ✗</text>
    <rect x="0" y="60" width="260" height="170" fill="#f7f9f4" stroke="#1a1a1a" stroke-width="2.5"/>
    <rect x="80" y="70" width="100" height="10" fill="#ffd9a0" stroke="#b8860b" stroke-width="1.6"/>
    <text x="130" y="98" text-anchor="middle" font-size="11.5" fill="#8a5a00">窗</text>
    <!-- shadow of person cast on desk -->
    <circle cx="130" cy="150" r="8" fill="#fce8ec" stroke="#d98aa0" stroke-width="1.5"/>
    <line x1="130" y1="158" x2="130" y2="182" stroke="#d98aa0" stroke-width="2"/>
    <path d="M 122 186 L 138 186 L 142 210 L 118 210 z" fill="#d9c8a0" opacity="0.8"/>
    <rect x="75" y="185" width="110" height="34" rx="3" fill="#f2ede2" stroke="#8a7a55" stroke-width="1.8"/>
    <text x="185" y="208" text-anchor="middle" font-size="10" fill="#8a6a00">影子落在纸上</text>
    <text x="130" y="262" text-anchor="middle" font-size="12" fill="#b07a2a">自己的影子正好盖住作业面</text>
  </g>
  <text x="450" y="362" text-anchor="middle" font-size="12.5" fill="#888">遮阳帘可降眩光，但也减自然光；纱帘/遮光帘/百叶各有透视、清洁、维护的代价。</text>
</svg>
