<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ISD-L06 render QA</title><body><iframe id="p" style="width:1440px;height:900px;border:0"></iframe><pre id="result">PENDING</pre><script>
(async()=>{const args=new URLSearchParams(location.search),offline=args.has('offline');let r={offline,ready:false,tier:null,errors:[],selftest:null,canvasCount:0,canvasSize:null};const frame=document.querySelector('#p');frame.src='render_preview.html'+(offline?'?offline=1':'');await new Promise(resolve=>{frame.onload=resolve;setTimeout(resolve,10000)});const w=frame.contentWindow;for(let i=0;i<100&&!w.__LAB_READY__;i++)await new Promise(x=>setTimeout(x,100));if(!offline)for(let i=0;i<150&&w.__LAB_TIER__!=='enhanced';i++)await new Promise(x=>setTimeout(x,100));try{r.ready=!!w.__LAB_READY__;r.tier=w.__LAB_TIER__;r.errors=w.__LAB_CONSOLE_ERRORS__||[];r.selftest=w.__LAB_SELFTEST__?w.__LAB_SELFTEST__():null;r.statusText=w.document.querySelector('#status')?.textContent||'';r.resourceText=w.document.querySelector('#resourceState')?.textContent||'';const c=w.document.querySelectorAll('canvas');r.canvasCount=c.length;if(c[0])r.canvasSize=[c[0].width,c[0].height];}catch(e){r.errors.push('harness: '+String(e))}document.querySelector('#result').textContent='QA_RESULT_JSON:'+JSON.stringify(r);})();
